# Банки дизайн-словаря для site-prompt.
# Формат строгий (парсит scripts/draw_axes.py):
#   key:
#     - "значение — краткая подсказка"
# Только top-level ключи вида `word:` и элементы `- "..."`. Комментарии `#` игнорируются.
# Банки МОЖНО и НУЖНО расширять — чем больше значений, тем больше пространство неповторимости.
# Каждое значение = "ярлык — подсказка"; writing-guide.md разворачивает ярлык в прозу.

visual_style:
  - "Editorial serif revival — крупная контрастная антиква, широкие поля, журнальная сетка, много воздуха"
  - "Warm minimalism — тёплый беж/крем, мягкие тени, скруглённые формы, спокойный премиум"
  - "Neo-brutalism lite — жирные бордеры, плоские блоки, резкий контраст, но читабельно и по делу"
  - "Swiss / International — строгая модульная сетка, гротеск, левое выравнивание, дисциплина"
  - "Dark luxury — глубокий графит/уголь, золотой или медный акцент, кинематографично, дорого"
  - "Organic / earthy — природные текстуры, оливково-терракотовая гамма, рукотворность"
  - "Glassmorphism — полупрозрачные слои, blur, светящиеся градиенты поверх фото"
  - "Bento grid — крупные скруглённые карточки-плитки разного размера, дашбордная подача"
  - "Corporate clean — синий/белый, аккуратные карточки, иконки, доверие B2B"
  - "Retro-modern / Y2K-refined — контролируемая ностальгия, гротеск, ретро-палитра, но чисто"
  - "Gradient mesh — плавные многоцветные меши на фоне, современно и живо"
  - "Monospace tech — моноширинный акцентный шрифт, сетка-терминал, инженерная эстетика"
  - "Soft neumorphism — мягкие вдавленные/выпуклые поверхности, пастель, тактильность"
  - "High-contrast editorial — чёрное на белом, огромные заголовки, минимум цвета, максимум типографики"
  - "Artisanal / craft — крафтовая бумага, штампы, ручные иллюстрации, локальный шарм"
  - "Nordic calm — приглушённая скандинавская палитра, свет, простор, функциональность"
  - "Vibrant playful — сочные цвета, крупные формы, дружелюбно, энергия для молодого бизнеса"
  - "Muted pastel — пыльные пастельные тона, деликатность, wellness-настроение"
  - "Luxury boutique — приглушённое золото/шампань, засечки, тонкие линии, эксклюзив"
  - "Industrial / utilitarian — бетон, металл, техничные подписи, честная фактура"
  - "Botanical fresh — зелёные акценты, растительные паттерны, экологичность"
  - "Cinematic fullscreen — полноэкранные кадры, наложенный текст, драматургия скролла"
  - "Data-driven modern — графики, метрики, аккуратные таблицы, аналитический тон"
  - "Handcrafted warm — тёплая палитра, неровные линии, персональность мастера"
  - "Minimal mono-accent — почти монохром + один яркий фирменный цвет-акцент"
  - "Refined gradient — сдержанные двухцветные градиенты в кнопках и хедере, современно"
  - "Magazine collage — коллажная вёрстка, наложение, разноразмерные фото, редакционность"
  - "Structured grid pro — жёсткая колоночная сетка, крупные числа, профессиональная строгость"

layout_archetype:
  - "Split-screen — экран делится вертикально: слева контент, справа медиа/форма"
  - "Centered stack — всё по центру колонкой, крупные секции сверху вниз, простая ось"
  - "Sidebar-anchored — фиксированное боковое меню/оглавление, контент справа"
  - "Asymmetric editorial — намеренная асимметрия, смещённые блоки, журнальный ритм"
  - "Full-width bands — широкие цветные ленты-секции во всю ширину, чередование фонов"
  - "Card-mosaic — контент разложен по карточкам разного размера (bento)"
  - "Storytelling scroll — длинный нарративный скролл, секции как главы истории"
  - "Grid catalog-first — акцент на сетку товаров/услуг сразу, витринный подход"
  - "Hero + tabbed sections — герой сверху, ниже переключаемые вкладки контента"
  - "Zigzag alternating — блоки текст/картинка чередуются лево-право (Z-паттерн)"
  - "Overlapping layers — секции наезжают друг на друга, глубина за счёт слоёв"
  - "Column magazine — многоколоночная вёрстка как в журнале/газете"
  - "Sticky-nav longpage — липкая навигация с якорями по длинной странице"
  - "Dashboard-like — плиточная приборная подача метрик/фич на главной"
  - "Framed / bordered — весь контент в рамке-обводке, аккуратные внутренние границы"
  - "Diagonal sections — диагональные срезы между секциями, динамика"
  - "Modular blocks — независимые самодостаточные блоки-модули, легко переставлять"
  - "Timeline-driven — вертикальная/горизонтальная ось-таймлайн как каркас страницы"

hero_type:
  - "Fullscreen photo + overlay headline — кадр во весь экран, крупный заголовок поверх"
  - "Split hero — заголовок+CTA слева, продуктовое фото/иллюстрация справа"
  - "Typographic hero — огромный текстовый заголовок без фото, чистая типографика"
  - "Video-loop hero — фоновое зацикленное видео/анимация за заголовком"
  - "Product-shot hero — крупный рендер продукта по центру, минимум текста"
  - "Search-first hero — крупная строка поиска/подбора в центре героя"
  - "Stat hero — герой с крупными цифрами-достижениями (лет на рынке, клиентов)"
  - "Carousel hero — слайдер из нескольких офферов/кейсов"
  - "Illustration hero — фирменная иллюстрация/сцена как главный визуал"
  - "Form-in-hero — сразу форма заявки/расчёта справа в первом экране"
  - "Gradient hero — герой на фирменном градиент-меше, текст + двойной CTA"
  - "Collage hero — коллаж из нескольких фото + заголовок"
  - "Map hero — интерактивная/статичная карта локаций как визуал героя"
  - "Testimonial hero — герой построен вокруг сильного отзыва/цитаты клиента"
  - "Bento hero — первый экран уже как набор плиток (ценность, фото, метрика, CTA)"
  - "Minimal centered hero — короткий заголовок + подзаголовок + одна кнопка, много воздуха"
  - "Before/after hero — визуальное сравнение до/после как крючок"
  - "Category tiles hero — герой = крупные плитки категорий услуг/товаров"
  - "Announcement-bar hero — тонкая верхняя полоса-акция + классический герой ниже"
  - "Portrait hero — крупный портрет основателя/мастера + личное обращение"

