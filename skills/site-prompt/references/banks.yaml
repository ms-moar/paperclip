font_pairing:
  - "Заголовки: контрастная антиква (Playfair/Fraunces-типа) + текст гротеск"
  - "Заголовки и текст: чистый гуманистический гротеск (Inter/Manrope-типа), разный вес"
  - "Заголовки: геометрический гротеск + текст с засечками для body (обратный контраст)"
  - "Заголовки: конденсированный гротеск (плакатность) + нейтральный текст"
  - "Заголовки: высокий дисплейный шрифт + моноширинный акцент для деталей/цен"
  - "Заголовки и текст: одна суперсемья гротеска, вся иерархия через вес и размер"
  - "Заголовки: мягкая скруглённая антиква + дружелюбный sans body"
  - "Заголовки: техничный grotesque + monospace для меток и подписей"
  - "Заголовки: классическая антиква Didone + гротеск body (редакционно)"
  - "Заголовки: humanist serif + humanist sans (тёплая пара для wellness)"
  - "Заголовки: индустриальный гротеск заглавными + компактный body"
  - "Заголовки: элегантный высокий serif + мелкий трекинговый sans-подзаголовок"
  - "Заголовки: гротеск с характером (необычная g/a) + нейтральный body"
  - "Заголовки: слэб-сериф + чистый sans body (крепко, честно)"
  - "Заголовки и цитаты: курсивная антиква для акцентов + grotesque основа"
  - "Заголовки: очень крупный display sans + мелкий serif для сносок/цитат"
  - "Заголовки: geometric sans + serif для длинных статей блога"
  - "Заголовки: neo-grotesque (Helvetica-строгость) + тот же для текста"
  - "Заголовки: рукописно-каллиграфический акцент (умеренно) + sans основа"
  - "Заголовки: condensed serif display + humanist sans body"
  - "Заголовки: тёплый rounded sans + mono для цифр/таймингов"
  - "Заголовки: high-contrast serif + grotesque, плюс small-caps для навигации"

